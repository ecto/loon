[package]
name = "loon-kernel"
version = "0.7.0"
edition = "2021"
description = "Loon as a unikernel: the EIR VM on bare metal, drivers as effect handlers."

# Deliberately outside the root workspace: this crate only builds for a
# bare-metal target and must not be swept into `cargo build --workspace`.
[workspace]

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# An interpreter lives or dies on inlining, and `opt-level = "z"` suppresses
# it — the dispatch loop was ~150x slower than a native one under `z`. The
# image is small either way; there is nothing here worth trading speed for.
opt-level = 3
lto = true
codegen-units = 1
