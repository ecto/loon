[package]
name = "loon-lang"
version.workspace = true
edition.workspace = true

[features]
default = []
pkg-fetch = ["dep:blake3", "dep:ureq", "dep:flate2", "dep:tar", "dep:uuid"]
# Real GPU execution through wgpu (Metal here, Vulkan/DX12 elsewhere).
# Off by default: it is a large dependency, and every other placement mode
# works without it.
gpu = ["dep:wgpu", "dep:pollster"]
native = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[dependencies]
logos = "0.15"
codespan-reporting = "0.11"
wasm-encoder = "0.227"
dirs-next = "2"
serde_json = "1"
imbl = "3"
blake3 = { version = "1", optional = true }
ureq = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
cranelift-codegen = { version = "0.116", optional = true }
cranelift-frontend = { version = "0.116", optional = true }
cranelift-jit = { version = "0.116", optional = true }
cranelift-module = { version = "0.116", optional = true }
cranelift-native = { version = "0.116", optional = true }
wgpu = { version = "25", optional = true, default-features = false, features = [
    "metal",
    "vulkan",
    "wgsl",
] }

pollster = { version = "0.4", optional = true }

[dev-dependencies]
insta = "1"
# Validates emitted WGSL the way a driver would, so shader errors surface in
# CI rather than on a machine that happens to have a GPU.
naga = { version = "25", features = ["wgsl-in"] }
wasmparser = "0.227"
