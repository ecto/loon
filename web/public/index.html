<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loon — A LISP that flies</title>
  <meta name="description" content="Loon is a modern LISP with invisible types, algebraic effects, and ownership without annotations.">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
</head>
<body>
  <div id="app">
    <noscript>
      <p>Loon requires JavaScript to run — it's literally a programming language running in your browser.</p>
    </noscript>
  </div>
  <script type="module" src="/boot.js"></script>
  <script>
  // Mobile menu — tiny inline script for pre-rendered pages
  document.addEventListener('DOMContentLoaded', () => {
    const sidebar = document.querySelector('.sidebar');
    if (!sidebar) return;
    const btn = document.createElement('button');
    btn.className = 'menu-toggle';
    btn.setAttribute('aria-label', 'Menu');
    btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = '<span></span><span></span><span></span>';
    const backdrop = document.createElement('div');
    backdrop.className = 'sidebar-backdrop';
    sidebar.parentNode.insertBefore(btn, sidebar);
    sidebar.parentNode.insertBefore(backdrop, sidebar);
    function toggle(open) {
      const isOpen = open ?? !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', isOpen);
      backdrop.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
    }
    btn.addEventListener('click', () => toggle());
    backdrop.addEventListener('click', () => toggle(false));
    sidebar.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') toggle(false);
    });
  });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
